name: smoodle-build

# Builds the smoodle-patched librime fork by delegating to upstream's
# per-OS workflows (linux-build.yml / macos-build.yml / windows-build.yml).
#
# Why workflow_call: upstream's workflows already handle vcpkg bootstrap
# on Windows, brew deps on macOS, apt deps on Linux, and per-arch flags.
# Inlining `make release` / `build.bat` reinvented this and dropped the
# Windows ball. Run 25425316371 (inline build) failed at `build.bat
# thirdparty`; run 25428394245 (upstream's matrix on the same source)
# passed all four Windows variants. The fix is to delegate.
#
# Triggers:
#   - push to 1.16.0-smoodle* branches  → CI validates on macOS, Linux,
#                                         and Windows matrices
#   - push of 1.16.0-smoodle.* tags     → reproducible build per release
#   - workflow_dispatch                 → ad-hoc verification
#
# Plugins: Phase 1 dogfood is dict-only. No `rime_plugins` parameter
# until 1.5 lands the LLM / lua plugin work.

on:
  push:
    branches:
      - '1.16.0-smoodle**'
    tags:
      - '1.16.0-smoodle.*'
  workflow_dispatch:

jobs:
  macos:
    uses: ./.github/workflows/macos-build.yml

  linux:
    uses: ./.github/workflows/linux-build.yml

  windows:
    uses: ./.github/workflows/windows-build.yml
